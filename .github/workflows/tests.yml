name: Core tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix apps/deutsch-live/standalone --ignore-scripts
      - run: npm ci --prefix apps/italian-live/standalone --ignore-scripts
      - run: node scripts/test.mjs
